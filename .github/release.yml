# .github/release.yml
# GitHub 官方 Release 自动分组与变更日志模板
# 参考: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  categories:
    - title: "🚀 Features / 新增功能"
      labels:
        - "enhancement"
        - "feature"
        - "feat"
    - title: "🐛 Bug Fixes / 错误修复"
      labels:
        - "bug"
        - "fix"
    - title: "🛠️ Maintenance & Improvements / 工程与维护"
      labels:
        - "release"
        - "chore"
        - "ci"
        - "documentation"
        - "*"
