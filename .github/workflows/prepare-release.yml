name: Release Prepare PR

# 发版准备流水线：
# 1) 在 Actions 界面手动触发（workflow_dispatch）
# 2) 版本号选填（留空则自动按 patch / minor / major 递增）
# 3) 自动修改 package.json 并同步 MCP 子包与锁文件
# 4) 本地运行测试与构建校验（确保零缺陷）
# 5) 创建 release/vX.Y.Z 分支并提交，通过 gh pr create 自动向 master 发起 PR
# 6) 尝试标记 --auto 自动合并（配合分支保护与安全审计流水线）
on:
  workflow_dispatch:
    inputs:
      version:
        description: "目标版本号（例如 1.0.1，留空则自动递增）"
        required: false
        default: ""
      bump_type:
        description: "未填版本号时的自动递增规则"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 1. 自动计算目标版本并写入所有 package.json 与 package-lock.json
      - name: Bump & Sync Versions
        id: bump
        run: node scripts/bump-version.mjs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP_TYPE: ${{ inputs.bump_type }}

      # 2. 严谨校验：单元测试、MCP 桥接测试与 Chrome 扩展构建
      - name: Verify Core Tests & Build
        run: |
          npm ci
          node test/verify-core.js
          npm --prefix packages/smart-bookmark-mcp ci
          npm --prefix packages/smart-bookmark-mcp test
          npm run build

      # 3. 生成版本变更日志（conventional-changelog）
      - name: Generate Release Notes
        run: npm run release:notes

      # 4. 创建发版分支并提交变更
      - name: Create Release Branch & Commit
        run: |
          NEW_V="${{ steps.bump.outputs.new_version }}"
          BRANCH="release/v${NEW_V}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json packages/smart-bookmark-mcp/package.json packages/smart-bookmark-mcp/package-lock.json
          git commit -m "chore(release): bump version to ${NEW_V}"
          git push -u origin "$BRANCH" --force

      # 5. 本地前置零信任安全审计（白名单与版本一致性校验）
      - name: Run Zero-trust Security Audit
        run: node scripts/verify-release-pr.mjs

      # 6. 通过 GitHub CLI 创建或复用 PR，并配置自动合并与自动审批
      - name: Create Pull Request & Enable Auto-merge
        id: pr-step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_V: ${{ steps.bump.outputs.new_version }}
        run: |
          # 确保 release 标签存在（避免因仓库缺少标签导致创建 PR 失败）
          gh label create "release" --color "0E8A16" --description "Automated Release PR" --force || true

          cat << 'EOF' > pr_body.md
          ## 🚀 Automated Release PR for v__VERSION__

          This PR was automatically generated by the Release Prepare workflow.
          - Root package version: `v__VERSION__`
          - MCP sub-package version: `v__VERSION__`
          - Lockfiles synchronized
          - `RELEASE_NOTES.md` generated via Conventional Commits

          **Security & Checks**:
          Zero-trust security audit and core tests passed before submission.
          EOF

          sed -i "s/__VERSION__/${NEW_V}/g" pr_body.md

          BRANCH="release/v${NEW_V}"
          # 幂等性检测：若已有针对该分支打开的 PR，则直接复用
          PR_URL=$(gh pr list --head "$BRANCH" --base master --state open --json url --jq '.[0].url // empty')

          if [ -z "$PR_URL" ]; then
            echo "Creating new PR for branch $BRANCH..."
            PR_URL=$(gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "chore(release): bump version to ${NEW_V}" \
              --label "release" \
              --body-file pr_body.md)
            echo "Created PR: $PR_URL"
          else
            echo "Found existing open PR: $PR_URL, updating content..."
            gh pr edit "$PR_URL" --title "chore(release): bump version to ${NEW_V}" --body-file pr_body.md
          fi

          rm -f pr_body.md
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

          # 登记为排队自动合并
          gh pr merge "$PR_URL" --auto --squash || echo "Notice: Auto-merge could not be set automatically; continuing..."

      # 7. 使用专用 RELEASE_BOT_TOKEN 代签审批（满足 master 分支 protection 的 1 reviewing approval 规则）
      - name: Auto-approve Release PR
        if: steps.pr-step.outputs.pr_url != ''
        env:
          BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          PR_URL: ${{ steps.pr-step.outputs.pr_url }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "Approving PR via RELEASE_BOT_TOKEN to satisfy branch protection requirements..."
            GH_TOKEN="$BOT_TOKEN" gh pr review "$PR_URL" --approve --body "✅ Automated zero-trust audit passed. Release approved by configured release token." || echo "Warning: Auto-approve failed or already approved."
          else
            echo "Notice: RELEASE_BOT_TOKEN not configured. PR will wait for manual reviewer approval."
          fi
