name: Release Prepare PR

# 发版准备流水线：
# 1) 在 Actions 界面手动触发（workflow_dispatch）
# 2) 版本号选填（留空则自动按 patch / minor / major 递增）
# 3) 自动修改 package.json 并同步 MCP 子包与锁文件
# 4) 本地运行测试与构建校验（确保零缺陷）
# 5) 创建 release/vX.Y.Z 分支并提交，通过 gh pr create 自动向 master 发起 PR
# 6) 尝试标记 --auto 自动合并（配合分支保护与安全审计流水线）
on:
  workflow_dispatch:
    inputs:
      version:
        description: "目标版本号（例如 1.0.1，留空则自动递增）"
        required: false
        default: ""
      bump_type:
        description: "未填版本号时的自动递增规则"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 1. 自动计算目标版本并写入所有 package.json 与 package-lock.json
      - name: Bump & Sync Versions
        id: bump
        run: node scripts/bump-version.mjs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP_TYPE: ${{ inputs.bump_type }}

      # 2. 严谨校验：单元测试、MCP 桥接测试与 Chrome 扩展构建
      - name: Verify Core Tests & Build
        run: |
          npm ci
          node test/verify-core.js
          npm --prefix packages/smart-bookmark-mcp ci
          npm --prefix packages/smart-bookmark-mcp test
          npm run build

      # 3. 生成版本变更日志（conventional-changelog）
      - name: Generate Release Notes
        run: npm run release:notes

      # 4. 创建发版分支并提交变更
      - name: Create Release Branch & Commit
        run: |
          NEW_V="${{ steps.bump.outputs.new_version }}"
          BRANCH="release/v${NEW_V}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json packages/smart-bookmark-mcp/package.json packages/smart-bookmark-mcp/package-lock.json RELEASE_NOTES.md
          git commit -m "chore(release): bump version to ${NEW_V}"
          git push -u origin "$BRANCH" --force

      # 5. 通过 GitHub CLI 创建 PR 并尝试启用自动合并
      - name: Create Pull Request & Enable Auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_V: ${{ steps.bump.outputs.new_version }}
        run: |
          cat << 'EOF' > pr_body.md
          ## 🚀 Automated Release PR for v__VERSION__

          This PR was automatically generated by the Release Prepare workflow.
          - Root package version: `v__VERSION__`
          - MCP sub-package version: `v__VERSION__`
          - Lockfiles synchronized
          - `RELEASE_NOTES.md` generated via Conventional Commits

          **Security & Checks**:
          Once the `Verify Release PR` zero-trust audit and core tests pass, this PR will be automatically merged into master.
          EOF

          sed -i "s/__VERSION__/${NEW_V}/g" pr_body.md

          PR_URL=$(gh pr create \
            --base master \
            --head "release/v${NEW_V}" \
            --title "chore(release): bump version to ${NEW_V}" \
            --label "release" \
            --body-file pr_body.md)

          rm -f pr_body.md
          echo "Created PR: $PR_URL"

          # 若仓库启用了 Allow auto-merge，则直接登记为排队自动合并
          gh pr merge "$PR_URL" --auto --squash || echo "Notice: Auto-merge could not be set automatically; please merge manually."
