name: Create Release

# 推送以 v 开头的标签（如 v1.0.0）时，构建扩展与 mcp 包并创建 GitHub Release。
# Release 附带三类产物：
#   1) 源码包 —— GitHub 自动生成的 Source code (zip / tar.gz)，无需额外步骤
#   2) 插件包 —— `wxt zip` 构建并打包的 Chrome 扩展 zip（.output/smart-bookmark-v<version>-chrome.zip）
#   3) mcp 包  —— 子包 `npm pack` 产出的 npm tarball（packages/smart-bookmark-mcp/*.tgz）
# 创建的 Release 会触发 publish.yml 的 release: types:[published] → 自动 npm publish，
# 形成「打 v 标签 → 建 Release(三类产物) → 发 npm」的完整自动化链。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # softprops/action-gh-release 需要写权限来创建 Release

jobs:
  release:
    name: Build and create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # conventional-changelog 需要完整历史与全部 tag 以计算变更
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 1) 插件包：安装根依赖并构建 + 打包 Chrome 扩展
      - name: Install root dependencies
        run: npm ci

      - name: Build & zip Chrome extension（插件包）
        run: npm run zip

      # 2) mcp 包：子包 npm pack
      - name: Pack mcp sub-package（mcp 包）
        working-directory: packages/smart-bookmark-mcp
        run: |
          npm ci
          npm pack

      # 3) 由 Conventional Commits 自动生成 Release 正文
      - name: Generate release notes（conventional-changelog）
        run: npm run release:notes

      # 4) 创建 Release，附插件包 + mcp 包 + 自动生成的变更日志正文
      #    （源码包由 GitHub 自动附带）
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*.zip
            packages/smart-bookmark-mcp/*.tgz
          body_path: RELEASE_NOTES.md # 由 conventional-changelog 生成，替代默认自动说明
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
