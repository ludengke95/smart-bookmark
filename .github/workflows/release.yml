name: Create Release

# 发布与打包流水线：
# 1) 响应 master 分支上合并的发版提交 (chore(release):)，自动打 Tag 并建 Release
# 2) 亦兼容手动推送以 v 开头的标签（如 v1.0.1）
# Release 附带三类产物：
#   1) 源码包 —— GitHub 自动生成的 Source code (zip / tar.gz)
#   2) 插件包 —— `wxt zip` 构建并打包的 Chrome 扩展 zip（.output/smart-bookmark-v<version>-chrome.zip）
#   3) mcp 包  —— 子包 `npm pack` 产出的 npm tarball（packages/smart-bookmark-mcp/*.tgz）
# 完成后将级联触发 publish.yml 自动发布到 npm。
on:
  push:
    tags:
      - "v*"
    branches:
      - master
  workflow_dispatch:
    inputs:
      force_tag:
        description: "强制指定发布 Tag（例如 v1.0.1，留空则自动从 package.json 读取）"
        required: false
        default: ""
permissions:
  contents: write # 需要写权限来打 Tag 和创建 Release

jobs:
  release:
    name: Build and create release
    # 闸门过滤：手动触发、推送 v* 标签、或 master 上合并了 chore(release): 发版提交时执行
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # conventional-changelog 需要完整历史与全部 tag 以计算变更
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 0) 同步并确定版本号；若在 master 分支且未打 Tag，则自动创建并推送 Tag
      - name: Sync & resolve release tag
        id: tag-step
        run: |
          node scripts/sync-versions.mjs
          ROOT_V=$(node -p "require('./package.json').version")
          SUB_V=$(node -p "require('./packages/smart-bookmark-mcp/package.json').version")

          if [ "$ROOT_V" != "$SUB_V" ]; then
            echo "::error::root package version ($ROOT_V) does not match sub-package version ($SUB_V)"
            exit 1
          fi

          INPUT_TAG="${{ inputs.force_tag }}"
          TARGET_TAG="${INPUT_TAG:-v${ROOT_V}}"
          echo "Target tag: $TARGET_TAG"
          # 若当前处于 master 分支，检查远程是否已存在该 tag
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" != "true" ]; then
            if git rev-parse -q --verify "refs/tags/$TARGET_TAG" >/dev/null; then
              echo "Tag $TARGET_TAG already exists."
            else
              echo "Creating and pushing tag $TARGET_TAG..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TARGET_TAG"
              git push origin "$TARGET_TAG"
            fi
          fi

          echo "RELEASE_TAG=$TARGET_TAG" >> "$GITHUB_ENV"

      # 1) 插件包：安装根依赖并构建 + 打包 Chrome 扩展
      - name: Install root dependencies
        run: npm ci

      - name: Build & zip Chrome extension（插件包）
        run: npm run zip

      # 2) CRX 包：使用 GitHub Secret 中的私钥安全打包离线 CRX
      - name: Pack CRX with Secure Private Key
        env:
          PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}
        run: |
          if [ -n "$PRIVATE_KEY" ]; then
            echo "Private key detected. Packing CRX extensions..."
            echo "$PRIVATE_KEY" > /tmp/extension-key.pem
            chmod 600 /tmp/extension-key.pem

            ROOT_V=$(node -p "require('./package.json').version")
            npx --yes crx pack .output/chrome-mv3 -p /tmp/extension-key.pem -o ".output/smart-bookmark-v${ROOT_V}-chrome.crx"
            npx --yes crx pack .output/edge-mv3 -p /tmp/extension-key.pem -o ".output/smart-bookmark-v${ROOT_V}-edge.crx"

            rm -f /tmp/extension-key.pem
            echo "CRX packaging completed successfully."
          else
            echo "::warning::EXTENSION_PRIVATE_KEY secret is not set. Skipping CRX packaging."
          fi

      # 3) mcp 包：子包 npm pack
      - name: Pack mcp sub-package（mcp 包）
        working-directory: packages/smart-bookmark-mcp
        run: |
          npm ci
          npm pack

      # 4) 由 Conventional Commits 与 GitHub PR 自动生成分类 Release 正文 (Closes #15)
      - name: Generate release notes
        run: npm run release:notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 5) 创建 Release，附插件包 (ZIP & CRX) + mcp 包 + 自动生成的变更日志正文
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            .output/*.zip
            .output/*.crx
            packages/smart-bookmark-mcp/*.tgz
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
