name: CI

# 持续集成与质量门禁：
# 1) Chrome 扩展与核心算法：在 PR / push(master) 时运行核心网络寻径算法测试与生产构建
# 2) smart-bookmark-mcp 子包：在 PR / push(master) 时运行 MCP 协议与桥接服务单元测试
# 全量覆盖所有 PR，杜绝路径过滤器导致的 Required Checks 悬空卡死问题
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  extension:
    name: Verify core & build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core topology algorithm tests
        run: node test/verify-core.js

      - name: Build Chrome extension
        run: pnpm run build

  mcp:
    name: Test smart-bookmark-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @ludengke95/smart-bookmark-mcp test
