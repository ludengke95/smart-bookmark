name: Publish smart-bookmark-mcp

# 自动发布到 npm 流水线：
# 1) 响应 Create Release 工作流成功执行完成（workflow_run 级联，规避 GITHUB_TOKEN 的 loop protection 拦截）
# 2) 支持手动触发（workflow_dispatch）与常规 Release 发布事件作为兜底
# 需要在仓库 Settings → Secrets 配置 NPM_TOKEN（npm 账号的 Automation/Publish Token）
on:
  workflow_run:
    workflows: ["Create Release"]
    types: [completed]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # 闸门过滤：
    # 1. 如果是由 workflow_run 触发，要求上游执行结果为 success
    # 2. 如果是 workflow_dispatch 或 release 事件，直接放行
    if: >
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/smart-bookmark-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/smart-bookmark-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
