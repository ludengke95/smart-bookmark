name: Publish smart-bookmark-mcp

# 自动发布到 npm 流水线：
# 1) 响应 Create Release 工作流成功执行完成（workflow_run 级联，规避 GITHUB_TOKEN 的 loop protection 拦截）
# 2) 支持手动触发（workflow_dispatch）随时在 Actions 界面一键执行/重试发包
# 需要在仓库 Settings → Secrets 配置 NPM_TOKEN（npm 账号的 Automation/Publish Token）
on:
  workflow_run:
    workflows: ["Create Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # 闸门过滤：手动触发放行，或上游 Create Release 成功完成时放行
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/smart-bookmark-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/smart-bookmark-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
