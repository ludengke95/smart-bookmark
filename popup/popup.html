<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380, initial-scale=1.0">
  <title>Smart Bookmark - 快捷直达</title>
  <link rel="stylesheet" href="../newtab/newtab.css">
  <link rel="stylesheet" href="./popup.css">
</head>
<body class="bg-[var(--bg-card)] text-[var(--text-main)] flex flex-col h-full antialiased selection:bg-indigo-500 selection:text-white" data-theme="dark-slate">

  <!-- Popup 顶栏 -->
  <div class="p-3 bg-[var(--bg-subtle)] border-b border-[var(--border)] flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-lg bg-[var(--primary)] text-white flex items-center justify-center shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
      </div>
      <div>
        <div class="font-bold text-xs text-[var(--text-main)]">Smart Bookmark</div>
        <div class="text-[10px] text-emerald-400 flex items-center gap-1 font-mono">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-dot"></span>
          <span id="popup-local-ip">探测中...</span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-1">
      <button id="btn-open-manager" title="在新标签页中打开完整管理页" class="p-1.5 rounded-lg hover:bg-[var(--bg-card-hover)] text-[var(--text-muted)] hover:text-[var(--text-main)] transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      </button>
    </div>
  </div>

  <!-- 快捷过滤搜索框 (自动聚焦) -->
  <div class="p-2.5 border-b border-[var(--border)] bg-[var(--bg-card)] flex-shrink-0">
    <div class="relative flex items-center bg-[var(--bg-subtle)] border border-[var(--border)] focus-within:border-[var(--primary)] rounded-xl px-2.5 py-1.5 transition-colors">
      <svg class="w-3.5 h-3.5 text-[var(--text-dim)] mr-1.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" id="popup-search-input" placeholder="输入书签名称/标签/URL快速过滤..." class="w-full bg-transparent border-0 outline-none text-xs text-[var(--text-main)] placeholder-[var(--text-dim)] focus:outline-none" autofocus autocomplete="off">
    </div>
  </div>

  <!-- 标签水平筛选条 -->
  <div id="popup-tag-bar" class="px-2.5 py-1.5 bg-[var(--bg-card)]/50 border-b border-[var(--border)] flex items-center gap-1 overflow-x-auto custom-scrollbar text-[10px] flex-shrink-0">
    <!-- 动态渲染标签 -->
  </div>

  <!-- 书签快速列表内容区 -->
  <div id="popup-bookmark-list" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
    <!-- 动态渲染条目 -->
  </div>

  <!-- 底部操作栏 -->
  <div class="p-2.5 bg-[var(--bg-subtle)] border-t border-[var(--border)] flex items-center justify-between text-[11px] text-[var(--text-dim)] flex-shrink-0">
    <span>按 <kbd class="px-1 py-0.2 bg-[var(--bg-card)] rounded border border-[var(--border)] font-mono">↑</kbd> <kbd class="px-1 py-0.2 bg-[var(--bg-card)] rounded border border-[var(--border)] font-mono">↓</kbd> 导航，<kbd class="px-1 py-0.2 bg-[var(--bg-card)] rounded border border-[var(--border)] font-mono">↵</kbd> 跳转</span>
    <button id="btn-add-current-tab" class="text-[var(--primary)] hover:underline flex items-center gap-1 font-medium">
      + 添加当前页面
    </button>
  </div>

  <!-- Popup 专用轻量 Toast -->
  <div id="popup-toast" class="hidden fixed bottom-12 left-1/2 -translate-x-1/2 px-3.5 py-1.5 rounded-xl bg-[var(--primary)] text-white text-xs font-semibold shadow-lg transition-all z-50 pointer-events-none">
    <span id="popup-toast-text">已添加</span>
  </div>

  <script type="module" src="./popup.js"></script>
</body>
</html>
